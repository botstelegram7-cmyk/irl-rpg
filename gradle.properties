# --- JVM settings -------------------------------------------------------------
# Tuned to stay comfortable on machines with limited RAM (CI containers, budget
# laptops). Raise -Xmx to 2g-4g locally for faster incremental builds.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configureondemand=false

# --- Kotlin -------------------------------------------------------------------
kotlin.code.style=official
# Compile in-process so only one JVM is needed during the build.
kotlin.compiler.execution.strategy=in-process

# --- Android ------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false
